<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A request enters through the FastAPI layer, then fans out to three parallel paths: a cached read/write path to PostgreSQL, an AI/RAG path through the vector DB to the LLM, and an async event path through Kafka to Celery workers; Grafana and OpenTelemetry trace the API layer and the workers.">
  <title>CRM platform request flow: API layer fans out to cache/DB, RAG retrieval, and async event processing</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a9bab"></path>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2b75f"></path>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6c7d"></path>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="600" fill="#0d1420"></rect>

  <!-- ── Arrows ── -->

  <!-- Client -> API -->
  <line x1="212" y1="300" x2="298" y2="300" stroke="#8a9bab" stroke-width="2" marker-end="url(#arrow)"></line>
  <rect x="220" y="283" width="72" height="18" fill="#0d1420"></rect>
  <text x="256" y="296" fill="#c3cdd6" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">HTTPS + JWT</text>

  <!-- API -> Redis (cache lane) -->
  <line x1="492" y1="285" x2="628" y2="90" stroke="#8a9bab" stroke-width="2" marker-end="url(#arrow)"></line>
  <rect x="500" y="165" width="82" height="18" fill="#0d1420"></rect>
  <text x="541" y="178" fill="#c3cdd6" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">cache read</text>

  <!-- Redis -> Postgres -->
  <line x1="782" y1="70" x2="858" y2="70" stroke="#8a9bab" stroke-width="2" marker-end="url(#arrow)"></line>
  <rect x="792" y="42" width="46" height="17" fill="#0d1420"></rect>
  <text x="815" y="54" fill="#c3cdd6" font-size="11" text-anchor="middle" font-family="ui-monospace, monospace">on miss</text>

  <!-- API -> Elasticsearch -->
  <line x1="492" y1="292" x2="628" y2="200" stroke="#8a9bab" stroke-width="2" marker-end="url(#arrow)"></line>
  <rect x="500" y="235" width="110" height="18" fill="#0d1420"></rect>
  <text x="555" y="248" fill="#c3cdd6" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">full-text query</text>

  <!-- API -> VectorDB (RAG lane, accent) -->
  <line x1="492" y1="305" x2="628" y2="315" stroke="#f2b75f" stroke-width="2.5" marker-end="url(#arrowAccent)"></line>
  <rect x="500" y="322" width="112" height="18" fill="#0d1420"></rect>
  <text x="556" y="335" fill="#f2b75f" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">embed + retrieve</text>

  <!-- VectorDB -> LLM -->
  <line x1="782" y1="315" x2="858" y2="315" stroke="#f2b75f" stroke-width="2.5" marker-end="url(#arrowAccent)"></line>
  <rect x="789" y="287" width="52" height="17" fill="#0d1420"></rect>
  <text x="815" y="299" fill="#f2b75f" font-size="11" text-anchor="middle" font-family="ui-monospace, monospace">context</text>

  <!-- LLM -> API (return, curved above) -->
  <path d="M 900,290 C 900,232 560,232 500,278" fill="none" stroke="#f2b75f" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" marker-end="url(#arrowAccent)"></path>
  <rect x="638" y="219" width="130" height="18" fill="#0d1420"></rect>
  <text x="703" y="232" fill="#f2b75f" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">grounded response</text>

  <!-- API -> Kafka (async lane) -->
  <line x1="492" y1="322" x2="628" y2="410" stroke="#8a9bab" stroke-width="2" marker-end="url(#arrow)"></line>
  <rect x="500" y="378" width="120" height="18" fill="#0d1420"></rect>
  <text x="560" y="391" fill="#c3cdd6" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">publish event (write)</text>

  <!-- Kafka -> Celery -->
  <line x1="782" y1="420" x2="858" y2="420" stroke="#8a9bab" stroke-width="2" marker-end="url(#arrow)"></line>
  <rect x="787" y="392" width="56" height="17" fill="#0d1420"></rect>
  <text x="815" y="404" fill="#c3cdd6" font-size="11" text-anchor="middle" font-family="ui-monospace, monospace">consume</text>

  <!-- Observability -> API (dashed) -->
  <line x1="430" y1="500" x2="392" y2="337" stroke="#5a6c7d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDashed)"></line>
  <!-- Observability -> Celery (dashed, orthogonal to avoid crossing boxes) -->
  <polyline points="560,500 560,470 928,470 928,452" fill="none" stroke="#5a6c7d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDashed)"></polyline>
  <rect x="415" y="440" width="98" height="16" fill="#0d1420"></rect>
  <text x="464" y="452" fill="#7a8a99" font-size="11" text-anchor="middle" font-family="ui-monospace, monospace">traces + metrics</text>

  <!-- ── Boxes ── -->

  <!-- Client -->
  <rect x="42" y="265" width="170" height="70" rx="10" fill="#16283d" stroke="#3a4a5c" stroke-width="1.5"></rect>
  <text x="127" y="295" fill="#f7f6f3" font-size="14" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">Web Client</text>
  <text x="127" y="314" fill="#8a9bab" font-size="11" text-anchor="middle" font-family="ui-monospace, monospace">React / Next.js</text>

  <!-- API Layer -->
  <rect x="300" y="265" width="192" height="70" rx="10" fill="#16283d" stroke="#3a4a5c" stroke-width="1.5"></rect>
  <text x="396" y="292" fill="#f7f6f3" font-size="14" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">API Layer</text>
  <text x="396" y="311" fill="#8a9bab" font-size="11" text-anchor="middle" font-family="ui-monospace, monospace">FastAPI (async) &#183; tenant / RBAC gate</text>

  <!-- Redis -->
  <rect x="630" y="40" width="150" height="60" rx="10" fill="#16283d" stroke="#3a4a5c" stroke-width="1.5"></rect>
  <text x="705" y="66" fill="#f7f6f3" font-size="13" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">Redis</text>
  <text x="705" y="83" fill="#8a9bab" font-size="11" text-anchor="middle" font-family="ui-monospace, monospace">distributed cache</text>

  <!-- Postgres -->
  <rect x="858" y="40" width="130" height="60" rx="10" fill="#16283d" stroke="#3a4a5c" stroke-width="1.5"></rect>
  <text x="923" y="63" fill="#f7f6f3" font-size="13" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">PostgreSQL</text>
  <text x="923" y="80" fill="#8a9bab" font-size="10" text-anchor="middle" font-family="ui-monospace, monospace">tenant-scoped</text>

  <!-- Elasticsearch -->
  <rect x="630" y="150" width="150" height="60" rx="10" fill="#16283d" stroke="#3a4a5c" stroke-width="1.5"></rect>
  <text x="705" y="176" fill="#f7f6f3" font-size="13" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">Elasticsearch</text>
  <text x="705" y="193" fill="#8a9bab" font-size="10" text-anchor="middle" font-family="ui-monospace, monospace">tenant-scoped</text>

  <!-- Vector DB (accent) -->
  <rect x="630" y="280" width="150" height="70" rx="10" fill="#241c0d" stroke="#f2b75f" stroke-width="1.5"></rect>
  <text x="705" y="308" fill="#f7f6f3" font-size="13" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">Vector DB</text>
  <text x="705" y="325" fill="#d9a34e" font-size="10" text-anchor="middle" font-family="ui-monospace, monospace">RAG index &#183; tenant-scoped</text>

  <!-- LLM API (accent) -->
  <rect x="858" y="280" width="130" height="70" rx="10" fill="#241c0d" stroke="#f2b75f" stroke-width="1.5"></rect>
  <text x="923" y="308" fill="#f7f6f3" font-size="13" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">LLM API</text>
  <text x="923" y="325" fill="#d9a34e" font-size="10" text-anchor="middle" font-family="ui-monospace, monospace">grounded generation</text>

  <!-- Kafka -->
  <rect x="630" y="390" width="150" height="60" rx="10" fill="#16283d" stroke="#3a4a5c" stroke-width="1.5"></rect>
  <text x="705" y="416" fill="#f7f6f3" font-size="13" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">Kafka</text>
  <text x="705" y="433" fill="#8a9bab" font-size="11" text-anchor="middle" font-family="ui-monospace, monospace">event bus</text>

  <!-- Celery Workers -->
  <rect x="858" y="390" width="130" height="60" rx="10" fill="#16283d" stroke="#3a4a5c" stroke-width="1.5"></rect>
  <text x="923" y="416" fill="#f7f6f3" font-size="13" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">Celery</text>
  <text x="923" y="433" fill="#8a9bab" font-size="11" text-anchor="middle" font-family="ui-monospace, monospace">async workers</text>

  <!-- Observability -->
  <rect x="360" y="500" width="220" height="60" rx="10" fill="#12202e" stroke="#3a4a5c" stroke-width="1.5" stroke-dasharray="4 3"></rect>
  <text x="470" y="526" fill="#c3cdd6" font-size="13" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">Observability</text>
  <text x="470" y="543" fill="#7a8a99" font-size="11" text-anchor="middle" font-family="ui-monospace, monospace">Grafana + OpenTelemetry</text>
</svg>
